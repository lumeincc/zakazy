<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFDF5">
<title>Журнал заказов производства</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FFC425'/%3E%3Cpath d='M10 11h12M10 16h12M10 21h8' stroke='%232D2A24' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"></noscript>
<style>
  :root {
    color-scheme: light;
    --ground: #FFFDF5;
    --surface: #FFFFFF;
    --surface-2: #FFF8E1;
    --surface-3: #FFF1C2;
    --ink: #2D2A24;
    --ink-2: #4D483D;
    --muted: #7C7563;
    --faint: #A89F88;
    --line: #F0E5C4;
    --line-2: #F6EFD8;
    --accent: #FFC425;
    --accent-hover: #FFB700;
    --accent-ink: #2D2A24;
    --focus: #E2A300;
    --danger: #C4432B;
    --danger-soft: #FDEDE8;
    --warn: #B36A00;
    --ok: #2E7F50;
    --st-new: #A39B87;
    --st-design: #E5B400;
    --st-supply: #E8892A;
    --st-production: #9670C4;
    --st-finish: #4D93CE;
    --st-ready: #38A06A;
    --st-shipped: #A39B87;
    --st-cancelled: #CFC6B0;
    --ps-new: #A39B87;
    --ps-work: #E5B400;
    --ps-pay: #E8892A;
    --ps-paid: #4D93CE;
    --ps-received: #38A06A;
    --ps-cancelled: #CFC6B0;
    --tint: 17%;
    --shadow: 0 1px 2px rgba(90, 70, 0, .05), 0 8px 24px rgba(90, 70, 0, .06);
    --shadow-dlg: 0 24px 64px rgba(70, 52, 0, .22);
    --font: "Nunito", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--ground); }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 55%, transparent); outline-offset: 2px; }

  .app { max-width: 1280px; margin-inline: auto; padding-inline: 24px; padding-block: 24px 72px; }

  /* ---------- шапка ---------- */
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; margin-bottom: 20px; }
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }

  /* переключатель «Заказы | Закупки» */
  .switch { display: inline-flex; gap: 3px; padding: 4px; background: var(--surface-3); border-radius: 14px; }
  .sw {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 36px; padding: 0 18px; border: 0; border-radius: 10px;
    background: transparent; color: var(--ink-2); font-size: 15px; font-weight: 800; cursor: pointer; white-space: nowrap;
  }
  .sw:hover { background: rgba(255, 255, 255, .55); }
  .sw[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(90, 70, 0, .12); }
  .sw-n {
    display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; padding: 0 16px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink);
    font-size: 15px; font-weight: 700; line-height: 1; white-space: nowrap;
    cursor: pointer; transition: border-color .15s, background-color .15s, box-shadow .15s;
  }
  .btn:hover { border-color: var(--faint); }
  .btn svg { flex: none; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 0 rgba(160, 110, 0, .18); }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-danger { border-color: transparent; background: transparent; color: var(--danger); }
  .btn-danger:hover { background: var(--danger-soft); }
  .btn-danger.armed { background: var(--danger); border-color: var(--danger); color: #FFFFFF; }

  /* ---------- сообщение над журналом ---------- */
  .notice {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    margin-bottom: 18px; padding: 14px 18px;
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--surface-2); color: var(--ink-2);
  }
  .notice p { margin: 0; flex: 1 1 320px; }

  /* ---------- этапы ---------- */
  .route {
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
    margin-bottom: 20px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    box-shadow: var(--shadow);
  }
  .rc {
    position: relative;
    display: grid; gap: 2px; align-content: start; justify-items: start;
    padding: 16px 16px 12px;
    border: 0; border-left: 1px solid var(--line-2);
    background: transparent; text-align: left; cursor: pointer;
    transition: background-color .15s;
  }
  .rc:first-child { border-left: 0; }
  .rc::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--st); transition: height .15s; }
  .rc:hover { background: var(--surface-2); }
  .rc[aria-pressed="true"] { background: var(--surface-2); background: color-mix(in srgb, var(--st) 12%, var(--surface)); }
  .rc[aria-pressed="true"]::before { height: 6px; }
  .rc-count { font-weight: 800; font-size: 28px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .rc-count.zero { color: var(--faint); }
  .rc-label { font-size: 14px; font-weight: 700; color: var(--ink-2); hyphens: auto; overflow-wrap: break-word; max-width: 100%; }
  .rc-late { min-height: 18px; font-size: 12.5px; font-weight: 700; color: var(--danger); }
  .route.route-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

  /* ---------- вкладки и фильтры ---------- */
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .tabs {
    display: flex; gap: 3px; padding: 4px; max-width: 100%;
    background: var(--surface-3); border-radius: 14px;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 13px; border: 0; border-radius: 10px;
    background: transparent; color: var(--ink-2);
    font-size: 14px; font-weight: 700; white-space: nowrap; cursor: pointer;
  }
  .tab:hover { background: rgba(255, 255, 255, .55); }
  .tab[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(90, 70, 0, .12); }
  .tab .n { font-size: 12.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tab.late .n { color: var(--danger); }

  .filters { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; flex: 1 1 440px; min-width: 0; }
  .search { position: relative; flex: 0 1 290px; min-width: 0; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
  .search input {
    width: 100%; height: 40px; padding: 0 12px 0 36px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 15px;
  }
  .search input::placeholder { color: var(--faint); }
  .select { height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 15px; cursor: pointer; max-width: 100%; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    height: 32px; padding: 0 4px 0 12px; border-radius: 999px;
    background: var(--surface-2); background: color-mix(in srgb, var(--st) var(--tint), var(--surface));
    border: 1px solid var(--line); border-color: color-mix(in srgb, var(--st) 40%, transparent);
    font-size: 14px; font-weight: 700;
  }
  .chip button { display: grid; place-items: center; width: 24px; height: 24px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; }
  .chip button:hover { color: var(--ink); background: rgba(255, 255, 255, .7); }

  /* ---------- список заказов ---------- */
  .sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
  .thead, .row {
    display: grid;
    grid-template-columns: 100px minmax(0, 1fr) minmax(0, 2.1fr) 200px 156px;
    column-gap: 18px; padding-inline: 20px;
  }
  .thead { padding-block: 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .th {
    display: inline-flex; align-items: center; gap: 4px; justify-self: start;
    padding: 0; border: 0; background: none; text-align: left;
    font-size: 13px; font-weight: 700; color: var(--muted);
  }
  button.th { cursor: pointer; }
  button.th:hover { color: var(--ink); }
  .th .arr { color: var(--ink); }

  .row {
    position: relative;
    padding-block: 15px; border-top: 1px solid var(--line-2);
    align-items: start; cursor: pointer; transition: background-color .12s, opacity .2s;
  }
  .tbody > .row:first-child { border-top: 0; }
  .row:hover { background: #FFFCEE; }
  .row > * { min-width: 0; }
  .row.is-late::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--danger); }
  .row.is-pending { opacity: .62; cursor: progress; }
  .row.flash { animation: flash 1.8s ease-out; }
  @keyframes flash { from { background-color: var(--surface-3); } to { background-color: transparent; } }

  .c-num { display: grid; gap: 2px; justify-items: start; align-content: start; }
  .num { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .num::before { content: "№\00a0"; color: var(--faint); font-weight: 700; }
  .recv { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .saving { font-size: 12.5px; font-weight: 700; color: var(--warn); }
  .c-cust { display: grid; gap: 2px; align-content: start; }
  .cust { font-weight: 700; overflow-wrap: anywhere; }
  .contact { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .c-item { display: grid; gap: 4px; align-content: start; justify-items: start; }
  .kind {
    display: inline-block; padding: 1px 9px; border-radius: 999px;
    background: var(--surface-2); color: var(--ink-2);
    font-size: 12.5px; font-weight: 700;
  }
  .title { font-weight: 800; font-size: 15.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .desc {
    font-size: 14px; color: var(--ink-2); white-space: pre-line; overflow-wrap: anywhere; hyphens: auto;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .is-cancelled .title { text-decoration: line-through; text-decoration-color: var(--faint); color: var(--muted); }

  .c-stage { display: grid; gap: 7px; justify-items: start; align-content: start; }
  .stage-pick { position: relative; display: inline-flex; align-items: center; max-width: 100%; }
  .stage-pick .dot { position: absolute; left: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--st); pointer-events: none; }
  .stage-pick .chev { position: absolute; right: 11px; color: var(--muted); pointer-events: none; }
  .stage-select {
    appearance: none; -webkit-appearance: none;
    max-width: 100%; height: 32px; padding: 0 30px 0 28px;
    border: 1px solid var(--line); border-color: color-mix(in srgb, var(--st) 40%, transparent); border-radius: 999px;
    background: var(--surface-2); background: color-mix(in srgb, var(--st) var(--tint), var(--surface));
    color: var(--ink); font-size: 14px; font-weight: 700; text-overflow: ellipsis; cursor: pointer;
  }
  .stage-select:disabled { opacity: 1; color: var(--ink); cursor: inherit; padding-right: 14px; }
  .stage-select:disabled + .chev { display: none; }
  .rmini { display: flex; gap: 3px; }
  .rmini i { width: 21px; height: 5px; border-radius: 3px; background: var(--line); }
  .rmini i.on { background: var(--c); }
  .since { font-size: 13px; color: var(--muted); }

  .c-due { display: grid; gap: 2px; align-content: start; }
  .due-date { font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .due-sub { font-size: 13px; color: var(--muted); }
  .due--danger .due-date { color: var(--danger); }
  .due--danger .due-sub { color: var(--danger); font-weight: 700; }
  .due--warn .due-sub { color: var(--warn); font-weight: 700; }
  .due--ok .due-sub { color: var(--ok); }
  .due--late .due-sub { color: var(--warn); }
  .due--none .due-date, .due--muted .due-date { color: var(--faint); font-weight: 700; }

  /* ---------- список заявок на закупку ---------- */
  .pthead, .prow {
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(0, 1.3fr) 190px 160px;
    column-gap: 18px; padding-inline: 20px;
  }
  .pthead { padding-block: 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .pg { border-top: 1px solid var(--line); }
  .tbody > .pg:first-child { border-top: 0; }
  .pg.is-pending { opacity: .62; }
  .pg.flash { animation: flash 1.8s ease-out; }
  .pg-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px;
    padding: 13px 20px 4px; cursor: pointer; font-size: 14px;
  }
  .pg-head:hover .pg-num { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .pg-num { font-weight: 800; font-size: 16px; white-space: nowrap; }
  .pg-meta { color: var(--muted); }
  .pg-for { font-weight: 700; color: var(--ink-2); overflow-wrap: anywhere; }
  .urgent { padding: 1px 9px; border-radius: 999px; background: var(--danger-soft); color: var(--danger); font-size: 12.5px; font-weight: 800; }
  .pg-need { margin-left: auto; font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
  .need--danger { color: var(--danger); }
  .need--warn { color: var(--warn); }
  .need--ok { color: var(--ok); }
  .need--muted { color: var(--faint); font-weight: 600; }

  .prow { position: relative; padding-block: 9px; align-items: center; cursor: pointer; transition: background-color .12s; }
  .prow:hover { background: #FFFCEE; }
  .prow > * { min-width: 0; }
  .prow:last-child { padding-bottom: 14px; }
  .prow.is-pending { cursor: progress; }
  .p-item { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  .p-title { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .p-qty { font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .p-sup { font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
  .p-none { color: var(--faint); }
  .p-eta { font-size: 13.5px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .eta--ok { color: var(--ok); }
  .eta--warn { color: var(--warn); }
  .eta--danger { color: var(--danger); }
  .eta--muted { color: var(--faint); font-weight: 600; }
  .prow.is-cancelled .p-title { text-decoration: line-through; text-decoration-color: var(--faint); color: var(--muted); }

  .skel { display: grid; gap: 10px; padding: 20px; border-top: 1px solid var(--line-2); }
  .skel:first-child { border-top: 0; }
  .skel i { display: block; height: 11px; border-radius: 6px; background: var(--line-2); }
  .skel i:nth-child(1) { width: 30%; }
  .skel i:nth-child(2) { width: 70%; }
  .skel i:nth-child(3) { width: 48%; }
  @media (prefers-reduced-motion: no-preference) {
    .skel i { animation: pulse 1.1s ease-in-out infinite alternate; }
  }
  @keyframes pulse { to { opacity: .45; } }

  .empty { display: grid; gap: 14px; justify-items: center; padding: 56px 18px; text-align: center; color: var(--muted); font-size: 15.5px; }
  .empty p { margin: 0; }

  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 12px 4px 0; font-size: 13.5px; color: var(--muted); }
  .foot .spacer { flex: 1; }
  .link {
    padding: 0; border: 0; background: none; color: var(--ink-2); font-size: 13.5px; font-weight: 700; cursor: pointer;
    text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px;
  }
  .link:hover { color: var(--ink); }
  #syncText.err { color: var(--danger); font-weight: 700; }

  /* ---------- вход ---------- */
  .app.locked { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding-block: 24px; }
  .gate { display: grid; justify-items: center; width: 100%; }
  .gate-card {
    width: min(400px, 100%); display: grid; gap: 16px; padding: 32px 28px 28px; text-align: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow);
  }
  .gate-card h2 { margin: 0 0 6px; font-weight: 800; font-size: 26px; line-height: 1.2; }
  .gate-card .field input { text-align: center; }
  .gate-card .btn { width: 100%; height: 48px; margin-top: 4px; font-size: 16px; }
  .app.locked .route, .app.locked .bar, .app.locked .sheet, .app.locked .foot,
  .app.locked .top, .app.locked .notice, .app.locked .view { display: none !important; }

  /* ---------- карточка заказа ---------- */
  .dlg {
    width: min(760px, calc(100vw - 32px)); max-height: min(92vh, 980px);
    padding: 0; border: 1px solid var(--line); border-radius: 22px;
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow-dlg);
  }
  .dlg[open] { display: flex; flex-direction: column; }
  .dlg::backdrop { background: rgba(45, 38, 20, .38); }
  .dlg form { display: flex; flex-direction: column; flex: 1; min-height: 0; margin: 0; }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px 14px; border-bottom: 1px solid var(--line-2); }
  .dlg-head h2 { margin: 0; font-weight: 800; font-size: 22px; line-height: 1.2; }
  .icon-btn { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .dlg-body { flex: 1; min-height: 0; overflow-y: auto; display: grid; gap: 14px; align-content: start; padding: 18px 22px; }
  .dlg-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--line-2); background: var(--surface-2); }
  .dlg-foot .spacer { flex: 1; }
  .form-msg { flex: 1 1 100%; margin: 0; font-size: 14px; color: var(--muted); }
  .form-msg:empty { display: none; }
  .form-msg.err { color: var(--danger); font-weight: 700; }

  .g { display: grid; gap: 12px; }
  .g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .field { display: grid; gap: 6px; align-content: start; min-width: 0; }
  .field > span { font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
  .field input, .field select, .field textarea {
    width: 100%; min-height: 42px; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink); font-size: 15px; line-height: 1.4;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--focus); outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 0; }
  .field textarea { min-height: 124px; resize: vertical; }
  .field input::placeholder, .field textarea::placeholder { color: var(--faint); }
  .field.invalid input, .field.invalid textarea { border-color: var(--danger); }
  .field .hint { font-size: 13px; color: var(--muted); }
  .req::after { content: " *"; color: var(--danger); }

  .hist-wrap h3 { margin: 4px 0 8px; font-size: 15px; font-weight: 800; color: var(--ink); }
  .hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  .hist li { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; align-items: baseline; gap: 10px; font-size: 14px; }
  .hist .d { width: 9px; height: 9px; border-radius: 50%; background: var(--st); }
  .hist b { font-weight: 800; }
  .hist .who { color: var(--muted); }
  .hist time { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---------- материалы в карточке заказа ---------- */
  .btn-sm { height: 34px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
  .mat-wrap { display: grid; gap: 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: #FFFDF6; }
  .mat-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
  .mat-head h3 { margin: 0; font-size: 15px; font-weight: 800; }
  .mat-sum { margin: 0; font-size: 14px; color: var(--muted); }
  .mat-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .mat-list li { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto; align-items: baseline; gap: 10px; font-size: 14px; cursor: pointer; }
  .mat-list li:hover .mat-t { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; }
  .mat-list .d { width: 9px; height: 9px; border-radius: 50%; background: var(--st); }
  .mat-s { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }

  /* ---------- карточка заявки на закупку ---------- */
  .dlg-wide { width: min(980px, calc(100vw - 32px)); }
  .dlg-wide .field textarea { min-height: 72px; }
  .check { display: inline-flex; align-items: center; gap: 9px; justify-self: start; font-weight: 700; cursor: pointer; }
  .check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent-hover); cursor: pointer; }
  .pitems-wrap { display: grid; gap: 10px; }
  .pitems-wrap h3 { margin: 4px 0 0; font-size: 15px; font-weight: 800; }
  .pitems { display: grid; gap: 10px; }
  .pi { display: grid; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: #FFFDF6; }
  .pi-main { display: grid; grid-template-columns: 22px minmax(0, 1fr) 100px 96px 36px; gap: 8px; align-items: center; }
  .pi-n { font-weight: 800; color: var(--faint); text-align: center; font-variant-numeric: tabular-nums; }
  .pi-buy { display: grid; grid-template-columns: 150px minmax(0, 1.5fr) 120px 110px 150px; gap: 8px; padding-left: 30px; }
  .pi-buy .field > span { font-size: 12.5px; }
  .pi .field input, .pi .field select { min-height: 40px; padding: 8px 10px; }
  .btn-add { justify-self: start; border-style: dashed; }
  .p-total { margin: 0; text-align: right; font-weight: 800; }

  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 60;
    max-width: calc(100vw - 32px); padding: 11px 18px; border-radius: 14px;
    background: var(--ink); color: #FFFFFF; font-size: 15px; font-weight: 600; box-shadow: 0 10px 28px rgba(40, 30, 0, .25);
    opacity: 0; transform: translate(-50%, 12px); transition: opacity .2s, transform .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--danger); }

  /* ---------- узкие экраны ---------- */
  @media (max-width: 900px) {
    .thead { display: none; }
    .row {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "num due" "item item" "cust cust" "stage stage";
      row-gap: 8px; column-gap: 12px; padding: 15px 16px;
    }
    .c-num { grid-area: num; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
    .c-due { grid-area: due; justify-items: end; text-align: right; }
    .c-item { grid-area: item; }
    .c-cust { grid-area: cust; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
    .c-stage { grid-area: stage; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .filters { flex-basis: 100%; justify-content: flex-start; }
    .search { flex: 1 1 220px; }
    .tab { padding: 0 11px; }
    .pthead { display: none; }
    .prow {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "item item" "sup sup" "stage eta";
      row-gap: 6px; column-gap: 12px; padding: 10px 16px;
    }
    .p-item { grid-area: item; }
    .p-sup { grid-area: sup; }
    .p-stage { grid-area: stage; }
    .p-eta { grid-area: eta; text-align: right; }
    .pg-head { padding-inline: 16px; }
    .pg-need { margin-left: 0; flex-basis: 100%; }
    .p-sup.is-empty, .p-eta.is-empty { display: none; }
  }
  @media (max-width: 760px) {
    .route { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .rc { padding: 14px 12px 10px; }
    .rc:nth-child(3n + 1) { border-left: 0; }
    .rc:nth-child(n + 4) { border-top: 1px solid var(--line-2); }
    .rc-count { font-size: 25px; }
    .rc-label { font-size: 13px; }
    .route.route-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .route.route-4 .rc:nth-child(n) { border-left: 1px solid var(--line-2); border-top: 1px solid var(--line-2); }
    .route.route-4 .rc:nth-child(odd) { border-left: 0; }
    .route.route-4 .rc:nth-child(-n + 2) { border-top: 0; }
    .pi-main { grid-template-columns: minmax(0, 1fr) 92px 36px; }
    .pi-n { display: none; }
    .pi-title { grid-column: 1 / -1; }
    .pi-buy { grid-template-columns: repeat(2, minmax(0, 1fr)); padding-left: 0; }
  }
  @media (max-width: 640px) {
    .app { padding-inline: 16px; padding-block: 16px 56px; }
    .dlg { width: 100%; max-width: 100%; height: 100%; max-height: 100%; margin: 0; border: 0; border-radius: 0; }
    .g-2, .g-3 { grid-template-columns: minmax(0, 1fr); }
    .g-2.keep { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dlg-head, .dlg-body, .dlg-foot { padding-inline: 16px; }
    .actions { width: 100%; }
    .actions .btn-primary { flex: 1; }
    .switch { width: 100%; }
    .sw { flex: 1; }
  }
  @media (max-width: 400px) {
    .route { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .rc:nth-child(n) { border-left: 1px solid var(--line-2); border-top: 1px solid var(--line-2); }
    .rc:nth-child(odd) { border-left: 0; }
    .rc:nth-child(-n + 2) { border-top: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="vh">Журнал заказов и закупок</h1>
    <div class="switch" role="group" aria-label="Раздел">
      <button type="button" class="sw" id="swOrders" data-view="orders" aria-pressed="true">Заказы</button>
      <button type="button" class="sw" id="swPurch" data-view="purchases" aria-pressed="false">Закупки<span class="sw-n" id="swN" hidden></span></button>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="btnExport" hidden title="Скачать этот раздел файлом Excel">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v7.5m0 0L5 7m3 3 3-3M3 13h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Excel</span>
      </button>
      <button type="button" class="btn btn-primary" id="btnNew" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="btnNewText">Новый заказ</span>
      </button>
    </div>
  </header>

  <section class="gate" id="gate" hidden>
    <form class="gate-card" id="gateForm" novalidate>
      <h2>Вход в журнал</h2>
      <label class="field" id="fld-api"><span>Адрес скрипта Google</span><input id="g-api" autocomplete="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <label class="field"><span>Код доступа</span><input id="g-code" type="password" autocomplete="current-password"></label>
      <label class="field"><span>Ваше имя</span><input id="g-name" autocomplete="name" placeholder="Как подписывать изменения"></label>
      <p class="form-msg" id="gateMsg" role="status"></p>
      <button type="submit" class="btn btn-primary" id="gateBtn">Войти</button>
    </form>
  </section>

  <div class="notice" id="notice" hidden>
    <p id="noticeText"></p>
    <button type="button" class="btn" id="noticeRetry" hidden>Повторить</button>
  </div>

  <div class="view" id="vOrders">
    <nav class="route" id="route" aria-label="Заказы по этапам производства"></nav>

    <div class="bar">
      <div class="tabs" id="tabs" role="group" aria-label="Какие заказы показать"></div>
      <div class="filters">
        <label class="search">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input type="search" id="q" placeholder="Поиск: заказчик, изделие, №" aria-label="Поиск по заказам" autocomplete="off">
        </label>
        <select class="select" id="kindFilter" aria-label="Вид изделия">
          <option value="">Все изделия</option>
        </select>
        <span class="chip" id="stageChip" hidden>
          <span id="stageChipText"></span>
          <button type="button" id="stageChipClear" aria-label="Сбросить фильтр по этапу">
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2 2 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </span>
      </div>
    </div>

    <section class="sheet" aria-label="Список заказов">
      <div class="thead" id="thead">
        <button type="button" class="th" data-sort="num" data-fk="th-num">№ и дата <span class="arr" id="arr-num"></span></button>
        <span class="th">Заказчик</span>
        <span class="th">Изделие и описание</span>
        <span class="th">Этап</span>
        <button type="button" class="th" data-sort="due" data-fk="th-due">Срок сдачи <span class="arr" id="arr-due"></span></button>
      </div>
      <div class="tbody" id="tbody"></div>
      <div class="empty" id="empty" hidden>
        <p id="emptyText"></p>
        <button type="button" class="btn" id="emptyReset" hidden>Сбросить фильтры</button>
        <button type="button" class="btn btn-primary" id="emptyAdd" hidden>
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Добавить первый заказ</span>
        </button>
      </div>
    </section>
  </div>

  <div class="view" id="vPurch" hidden>
    <nav class="route route-4" id="proute" aria-label="Позиции заявок по этапам закупки"></nav>

    <div class="bar">
      <div class="tabs" id="ptabs" role="group" aria-label="Какие позиции показать"></div>
      <div class="filters">
        <label class="search">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input type="search" id="pq" placeholder="Поиск: материал, поставщик, №" aria-label="Поиск по заявкам" autocomplete="off">
        </label>
        <select class="select" id="porder" aria-label="Для какого заказа">
          <option value="">Все заказы</option>
        </select>
        <span class="chip" id="pstageChip" hidden>
          <span id="pstageChipText"></span>
          <button type="button" id="pstageChipClear" aria-label="Сбросить фильтр по этапу">
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2 2 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </span>
      </div>
    </div>

    <section class="sheet" aria-label="Заявки на закупку">
      <div class="pthead">
        <span class="th">Материал и количество</span>
        <span class="th">Поставщик и сумма</span>
        <span class="th">Этап</span>
        <span class="th">Поставка</span>
      </div>
      <div class="tbody" id="pbody"></div>
      <div class="empty" id="pempty" hidden>
        <p id="pemptyText"></p>
        <button type="button" class="btn" id="pemptyReset" hidden>Сбросить фильтры</button>
        <button type="button" class="btn btn-primary" id="pemptyAdd" hidden>
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Создать первую заявку</span>
        </button>
      </div>
    </section>
  </div>

  <div class="foot">
    <span id="foot"></span>
    <span class="spacer"></span>
    <span id="syncText"></span>
    <button type="button" class="link" id="btnRefresh">Обновить</button>
    <a class="link" id="sheetLink" href="#" target="_blank" rel="noopener" hidden>Google Таблица</a>
    <button type="button" class="link" id="btnLogout">Выйти<span id="whoName"></span></button>
  </div>
</div>

<dialog class="dlg" id="dlg" aria-labelledby="dlgTitle">
  <form id="orderForm" novalidate>
    <div class="dlg-head">
      <h2 id="dlgTitle">Новый заказ</h2>
      <button type="button" class="icon-btn" id="dlgClose" aria-label="Закрыть">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="dlg-body">
      <div class="g g-2 keep">
        <label class="field" id="fld-num"><span class="req">№ заказа</span><input id="f-num" inputmode="numeric" autocomplete="off"></label>
        <label class="field" id="fld-received"><span class="req">Дата приёма</span><input id="f-received" type="date"></label>
      </div>
      <div class="g g-2">
        <label class="field"><span>Заказчик</span><input id="f-customer" list="customerList" autocomplete="off" placeholder="Организация или ФИО"></label>
        <label class="field"><span>Контакт</span><input id="f-contact" autocomplete="off" placeholder="Телефон, контактное лицо"></label>
      </div>
      <datalist id="customerList"></datalist>
      <div class="g g-2">
        <label class="field"><span>Вид изделия</span><select id="f-kind"></select></label>
        <label class="field" id="fld-title"><span>Наименование</span><input id="f-title" autocomplete="off" placeholder="Например: навес 18×6 м"></label>
      </div>
      <label class="field" id="fld-desc"><span>Описание заказа</span><textarea id="f-desc" rows="5" placeholder="Размеры, марка и толщина металла, комплектация, покраска (RAL), доставка и монтаж…"></textarea></label>
      <div class="g g-3">
        <label class="field"><span>Этап</span><select id="f-stage"></select><small class="hint" id="stageHint"></small></label>
        <label class="field" id="fld-due"><span>Срок сдачи</span><input id="f-due" type="date"></label>
        <label class="field" id="fld-shipped" hidden><span>Дата отгрузки</span><input id="f-shipped" type="date"></label>
      </div>
      <div class="mat-wrap" id="matWrap" hidden>
        <div class="mat-head">
          <h3>Материалы по заказу</h3>
          <button type="button" class="btn btn-sm" id="btnMatReq">
            <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>Заявка на материалы</span>
          </button>
        </div>
        <p class="mat-sum" id="matSum"></p>
        <ul class="mat-list" id="matList"></ul>
      </div>
      <div class="hist-wrap" id="histWrap" hidden>
        <h3>История этапов</h3>
        <ol class="hist" id="hist"></ol>
      </div>
    </div>
    <div class="dlg-foot">
      <p class="form-msg" id="formMsg" role="status"></p>
      <button type="button" class="btn btn-danger" id="btnDelete">Удалить</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="btnCancel">Отмена</button>
      <button type="submit" class="btn btn-primary" id="btnSave">Сохранить</button>
    </div>
  </form>
</dialog>

<dialog class="dlg dlg-wide" id="pdlg" aria-labelledby="pdlgTitle">
  <form id="pform" novalidate>
    <div class="dlg-head">
      <h2 id="pdlgTitle">Новая заявка</h2>
      <button type="button" class="icon-btn" id="pdlgClose" aria-label="Закрыть">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="dlg-body">
      <div class="g g-3">
        <label class="field"><span>Для заказа</span><select id="pf-order"></select></label>
        <label class="field"><span>Нужно к</span><input id="pf-need" type="date"></label>
        <label class="field"><span>Кто заказал</span><input id="pf-who" autocomplete="off" placeholder="Имя"></label>
      </div>
      <label class="check"><input type="checkbox" id="pf-urgent"><span>Срочно</span></label>
      <div class="pitems-wrap">
        <h3>Что купить</h3>
        <div class="pitems" id="pitems"></div>
        <button type="button" class="btn btn-add" id="pAddItem">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Добавить позицию</span>
        </button>
      </div>
      <label class="field"><span>Комментарий</span><textarea id="pf-comment" rows="2" placeholder="Например: резать по размерам, доставка на участок"></textarea></label>
      <p class="p-total" id="pTotal" hidden></p>
      <div class="hist-wrap" id="phistWrap" hidden>
        <h3>История</h3>
        <ol class="hist" id="phist"></ol>
      </div>
      <datalist id="unitList"></datalist>
      <datalist id="supplierList"></datalist>
      <datalist id="materialList"></datalist>
    </div>
    <div class="dlg-foot">
      <p class="form-msg" id="pformMsg" role="status"></p>
      <button type="button" class="btn btn-danger" id="pbtnDelete">Удалить заявку</button>
      <button type="button" class="btn" id="pbtnCopy" title="Скопировать список позиций, чтобы отправить поставщику">Текст для поставщика</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="pbtnCancel">Отмена</button>
      <button type="submit" class="btn btn-primary" id="pbtnSave">Сохранить</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* Адрес веб-приложения Google Apps Script (заканчивается на /exec) */
  var API_URL = 'https://script.google.com/macros/s/AKfycbzEh-UU8MMuUJ6PDiryl1GeI7XzcdwM7TUCjI50tWUo6vYok665IU9PaSWh0MF1QGwR/exec';

  /* ============ справочники ============ */
  var STAGES = [
    { key: 'new',        label: 'Принят',         hint: 'Заказ принят, ждёт запуска в работу' },
    { key: 'design',     label: 'Проектирование', hint: 'Чертежи, КМД, согласование с заказчиком' },
    { key: 'supply',     label: 'Закупка',        hint: 'Металл, огнеупоры, сэндвич-панели, комплектующие' },
    { key: 'production', label: 'Производство',   hint: 'Резка, гибка, сварка, сборка' },
    { key: 'finish',     label: 'Отделка',        hint: 'Грунт и покраска, футеровка, утепление и отделка модулей' },
    { key: 'ready',      label: 'Готов',          hint: 'Прошёл ОТК и испытания, ждёт отгрузки' },
    { key: 'shipped',    label: 'Отгружен',       hint: 'Передан заказчику' },
    { key: 'cancelled',  label: 'Отменён',        hint: 'Заказ снят' }
  ];
  var STAGE = {};
  STAGES.forEach(function (s, i) { STAGE[s.key] = Object.assign({ i: i }, s); });
  var ROUTE = STAGES.slice(0, 6);
  var ROUTE_KEYS = ROUTE.map(function (s) { return s.key; });
  function isActive(k) { return ROUTE_KEYS.indexOf(k) !== -1; }

  var KINDS = [
    { key: 'mk',          label: 'Металлоконструкции',      single: 'Металлоконструкция',      tag: 'Металлоконструкция' },

  function renderOrders() {

    var byKind = state.kind ? all.filter(function (o) { return o.kind === state.kind; }) : all;
    var c = counts(byKind, today);

    renderTabs(c, loading);

  /* ============ сообщения ============ */

  }
  function showFormMsg(msg, isErr) {

    els.formMsg.className = 'form-msg' + (isErr ? ' err' : '');
  }
  function setGateMsg(msg, isErr) {
    els.gateMsg.textContent = msg || '';
    els.gateMsg.className = 'form-msg' + (isErr ? ' err' : '');

  function errorText(e) {

    }
    if (code === 'timeout') return 'Google Таблица не ответила вовремя. Проверьте интернет и попробуйте ещё раз.';
    if (code === 'not_configured') return 'В скрипте Google не задан код доступа.';
    if (code === 'busy') return 'Таблица сейчас занята — повторите через несколько секунд.';
    if (code === 'not_found') return 'Заказ не найден — возможно, его уже удалили. Список обновлён.';
    if (code === 'num_taken') return 'Такой номер заказа уже есть в журнале' + (e.next ? ' — свободный номер ' + e.next : '') + '.';

  /* ============ связь с Google Таблицей ============ */
  function api(action, payload) {
    var url = apiUrl();
    if (!url) return Promise.reject({ error: 'network', message: 'не указан адрес скрипта' });
    var body = JSON.stringify(Object.assign({ action: action, code: creds.code || '', who: creds.name || '' }, payload || {}));

      }, function (err) {

  function applyList(res) {

    state.syncError = false;

  function start() {

    state.orders = cached.orders.map(normalize).sort(byNumDesc);
    var hasP = Array.isArray(cached.purchases);

    });

    });

  /* ============ вход и выход ============ */
  var gateTimer = null;
  function gateBusy(on) {

    var t0 = Date.now();
    els.gateBtn.textContent = 'Вхожу…';
    gateTimer = setInterval(function () {
      var sec = Math.round((Date.now() - t0) / 1000);

    }, 500);
  }
  function showGate(msg) {
    state.mode = 'login';
    els.gApiField.hidden = !!API_URL;
    els.gApi.value = creds.api || '';
    els.gName.value = creds.name || '';
    els.gCode.value = '';
    setGateMsg(msg || '', !!msg);
    gateBusy(false);
    render();
    warmUp();
    setTimeout(function () { (API_URL || creds.api ? els.gCode : els.gApi).focus(); }, 0);
  }
  function logout(msg) {
    creds.code = '';
    saveCreds();
    clearData();
    state.orders = [];
    state.purchases = [];
    state.ver = '';
    state.sheetUrl = '';
    state.lastSync = 0;
    clearRows();

    if (els.pdlg.open) closePDialog();

  }
  els.gateForm.addEventListener('submit', function (e) {
    e.preventDefault();

    var code = els.gCode.value.trim();
    var name = els.gName.value.trim();
    if (!API_URL && !/^https:\/\/script\.google(usercontent)?\.com\//.test(apiVal)) {
      setGateMsg('Вставьте адрес веб-приложения — он начинается с https://script.google.com/', true);

      state.mode = 'loading';

      gateBusy(false);
      creds.code = '';

  /* ============ смена этапа прямо в списке ============ */
  function changeStage(id, stage) {
    var o = findOrder(id);

    var prev = { stage: o.stage, shipped: o.shipped, history: o.history };
    o.stage = stage;
    if (stage === 'shipped') { if (!o.shipped) o.shipped = todayYMD(); }
    else o.shipped = '';
    o.history = o.history.concat([{ s: stage, at: new Date().toISOString(), by: creds.name || '' }]);
    render();
    toast('№ ' + o.num + ': ' + STAGE[stage].label.toLowerCase() + (stage === 'shipped' && !prev.shipped ? ', дата отгрузки — сегодня' : ''));
    write('stage', { id: id, stage: stage }).then(null, function (e) {
      var cur = findOrder(id);
      if (cur && cur === o) { cur.stage = prev.stage; cur.shipped = prev.shipped; cur.history = prev.history; render(); }
      if (!(e && e.error === 'bad_code')) toast('Этап не сохранился. ' + errorText(e), 'error');
    });
  }

  /* ============ карточка заказа ============ */
  var editing = null, formSnapshot = '', armTimer = null;

  function serializeForm() { return JSON.stringify(Object.keys(f).map(function (k) { return f[k].value; })); }
  function isDirty() { return !!formSnapshot && serializeForm() !== formSnapshot; }

  function syncStageUI() {
    var s = STAGE[f.stage.value] || STAGE['new'];
    els.stageHint.textContent = s.hint;
    var shipped = f.stage.value === 'shipped';
    els.fldShipped.hidden = !shipped;
    if (shipped && !f.shipped.value) f.shipped.value = todayYMD();
  }
  function disarmDelete() {
    clearTimeout(armTimer);

  }
  function renderHistory(o) {
    if (!o || !o.history.length) { els.histWrap.hidden = true; els.hist.innerHTML = ''; return; }
    els.histWrap.hidden = false;
    els.hist.innerHTML = o.history.slice().reverse().map(function (h) {
      var st = STAGE[h.s] || STAGE['new'];
      return '<li style="--st: var(--st-' + st.key + ')"><span class="d"></span>' +
        '<span><b>' + esc(st.label) + '</b>' + (h.by ? '<span class="who"> · ' + esc(h.by) + '</span>' : '') + '</span>' +
        '<time>' + esc(fmtDateTime(h.at)) + '</time></li>';

  function openDialog(o) {

    f.num.value = o ? String(o.num || '') : String(nextNum());
    f.received.value = o ? o.received : today;
    f.customer.value = o ? o.customer : '';
    f.contact.value = o ? o.contact : '';
    f.kind.value = o ? o.kind : '';
    f.title.value = o ? o.title : '';
    f.desc.value = o ? o.description : '';
    f.stage.value = o ? o.stage : 'new';
    f.due.value = o ? o.due : '';

    var names = [];
    state.orders.forEach(function (x) { if (x.customer && names.indexOf(x.customer) === -1) names.push(x.customer); });
    els.customerList.innerHTML = names.slice(0, 300).map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join('');

  function closeDialog() {

  }

  function readForm() {
    var stage = STAGE[f.stage.value] ? f.stage.value : 'new';

      num: parseInt(f.num.value.replace(/\D+/g, ''), 10),
      received: f.received.value,
      customer: f.customer.value.trim(), contact: f.contact.value.trim(),
      kind: f.kind.value, title: f.title.value.trim(), description: f.desc.value.trim(),

    };
  }
  function validate(v) {

    state.orders.forEach(function (o) { if (o.num === v.num && (!editing || o.id !== editing.id)) clash = o; });
    if (clash) return ['num', 'Номер ' + v.num + ' уже занят (' + (clash.customer || clash.title || 'другой заказ') + '). Свободный номер — ' + nextNum() + '.'];
    if (!v.received) return ['received', 'Укажите дату приёма заказа.'];
    if (!v.title && !v.description) return ['title', 'Напишите наименование или описание заказа.'];

  function reopenWithError(o, v, err) {

    f.kind.value = v.kind; f.title.value = v.title; f.desc.value = v.description; f.stage.value = v.stage;

  function saveForm(e) {
    e.preventDefault();
    if (state.mode !== 'live') { showFormMsg('Нет связи с журналом — обновите страницу.', true); return; }
    var v = readForm();
    var bad = validate(v);

  /* ============ выгрузка в Excel ============ */
  var xlsxPromise = null, exporting = false;

    if (xlsxPromise) return xlsxPromise;
    xlsxPromise = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = XLSX_URL;
      s.async = true;
      s.onload = function () { if (window.XLSX && window.XLSX.utils) resolve(window.XLSX); else reject(new Error('xlsx')); };
      s.onerror = function () { xlsxPromise = null; s.remove(); reject(new Error('xlsx')); };
      document.head.appendChild(s);
    });

  }

    label.textContent = 'Готовлю…';
    loadXlsx().then(function (X) {
      var today = todayYMD();
      var list = state.orders.filter(function (o) { return !o.pending; }).sort(function (a, b) { return a.num - b.num; });
      var head = ['№', 'Дата приёма', 'Заказчик', 'Контакт', 'Вид изделия', 'Наименование', 'Описание', 'Этап', 'Срок сдачи', 'Дата отгрузки', 'Срок: статус'];
      var aoa = [head].concat(list.map(function (o) {
        return [o.num || null, null, o.customer, o.contact, KIND[o.kind] ? KIND[o.kind].single : '', o.title, o.description,
          STAGE[o.stage].label, null, null, dueInfo(o, today).sub];
      }));
      var ws = X.utils.aoa_to_sheet(aoa);
      var base = Date.UTC(1899, 11, 30);
      function putDate(r, c, ymd) {
        var t = ymdToUTC(ymd);
        if (!isNaN(t)) ws[X.utils.encode_cell({ r: r, c: c })] = { t: 'n', v: (t - base) / 864e5, z: 'dd.mm.yyyy' };
      }
      list.forEach(function (o, i) { putDate(i + 1, 1, o.received); putDate(i + 1, 8, o.due); putDate(i + 1, 9, o.shipped); });
      ws['!cols'] = [6, 12, 30, 24, 22, 34, 70, 16, 12, 14, 28].map(function (w) { return { wch: w }; });

      a.download = 'Журнал заказов ' + fmtDate(today, true) + '.xlsx';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    }).catch(function () {
      toast('Не удалось подготовить файл Excel. Проверьте интернет и попробуйте ещё раз.', 'error');
    }).then(function () {

    });
  }

      var rec = cache.get(it.key);

        var el = t.content.firstElementChild;
        if (rec && rec.el.parentNode) rec.el.replaceWith(el);

  function fillPDatalists() {

  function serializePForm() {

  function openPDialog(req, preset) {

  function openPByReq(req) {
    var items = state.purchases.filter(function (p) { return p.req === req; });

  function closePDialog() {

  function readPForm() {
    var items = [].map.call(els.pitems.querySelectorAll('.pi'), function (row) {
      var g = function (k) { var el = row.querySelector('[data-f="' + k + '"]'); return el ? el.value.trim() : ''; };
      var it = {
        el: row, id: row.getAttribute('data-id') || '',
        title: g('title'), qtyRaw: g('qty'), unit: g('unit'),
        stage: g('stage'), supplier: g('supplier'), priceRaw: g('price'), invoice: g('invoice'), eta: g('eta')
      };
      it.qty = numOrEmpty(it.qtyRaw);
      it.price = numOrEmpty(it.priceRaw);
      return it;
    });
    return {
      order: parseInt(pf.order.value, 10) || 0, need: pf.need.value, who: pf.who.value.trim().slice(0, 60),
      urgent: pf.urgent.checked, comment: pf.comment.value.trim(), items: items
    };
  }
  function validateP(v) {
    var used = v.items.filter(function (it) { return it.title || it.qtyRaw || it.priceRaw || it.supplier || it.invoice; });
    if (!used.length) {
      return { msg: 'Добавьте хотя бы одну позицию — что нужно купить.', el: v.items[0] ? v.items[0].el.querySelector('[data-f="title"]') : null };
    }
    for (var i = 0; i < v.items.length; i++) {
      var it = v.items[i], n = i + 1;
      if (used.indexOf(it) === -1) continue;
      if (!it.title) return { msg: 'Позиция ' + n + ': напишите, что купить.', el: it.el.querySelector('[data-f="title"]') };
      if (it.qtyRaw && (it.qty === '' || it.qty < 0)) return { msg: 'Позиция ' + n + ': количество — это число, например 2,5.', el: it.el.querySelector('[data-f="qty"]') };
      if (it.priceRaw && (it.price === '' || it.price < 0)) return { msg: 'Позиция ' + n + ': цена — это число, например 5200.', el: it.el.querySelector('[data-f="price"]') };
    }
    v.items = used;
    return null;
  }
  function revealP(v) {
    if (state.p.tab !== 'all' && state.p.tab !== 'active') state.p.tab = 'active';
    if (state.p.stage) state.p.stage = '';
    if (state.p.order && (parseInt(state.p.order, 10) || 0) !== v.order) state.p.order = '';
    if (state.p.q) { state.p.q = ''; els.pq.value = ''; }
  }
  function reopenPWithError(orig, v, err) {
    if (orig && !state.purchases.some(function (p) { return p.req === orig.req; })) orig = null;
    openPDialog(orig ? orig.req : 0, { order: v.order });
    fillPOrderSelect(v.order);
    pf.need.value = v.need;
    pf.who.value = v.who;
    pf.urgent.checked = v.urgent;
    pf.comment.value = v.comment;
    els.pitems.innerHTML = v.items.map(function (it, i) {
      return pitemHTML({ id: it.id, title: it.title, qty: it.qty, unit: it.unit, stage: it.stage || 'new', supplier: it.supplier, price: it.price, invoice: it.invoice, eta: it.eta }, i, !!pediting);
    }).join('');
    updatePTotal();
    showPFormMsg('Заявка не сохранилась. ' + errorText(err), true);

  function savePForm(e) {
    e.preventDefault();
    if (state.mode !== 'live') { showPFormMsg('Нет связи с журналом — обновите страницу.', true); return; }
    var v = readPForm();
    els.pform.querySelectorAll('.field.invalid').forEach(function (n) { n.classList.remove('invalid'); });
    var bad = validateP(v);
    if (bad) {
      showPFormMsg(bad.msg, true);
      if (bad.el) {
        var fld = bad.el.closest('.field');
        if (fld) fld.classList.add('invalid');
        bad.el.focus();
      }
      return;
    }
    var orig = pediting, wasNew = !orig;
    var now = new Date().toISOString(), who = creds.name || '';
    var req = wasNew ? nextReq() : orig.req;
    var date = wasNew ? todayYMD() : orig.items[0].date;
    // сразу показываем заявку в списке, а в таблицу она уходит в фоне
    var local = v.items.map(function (it) {
      var prev = it.id ? findP(it.id) : null;
      var stage = PSTAGE[it.stage] ? it.stage : prev ? prev.stage : 'new';
      var p = pnormalize({
        id: it.id || tmpId(), req: req, date: date, who: v.who || who, order: v.order, need: v.need, urgent: v.urgent,
        title: it.title, qty: it.qty, unit: it.unit, stage: stage, supplier: it.supplier, price: it.price, invoice: it.invoice, eta: it.eta,
        got: stage === 'received' ? ((prev && prev.got) || todayYMD()) : '', comment: v.comment,
        history: prev ? (prev.stage !== stage ? prev.history.concat([{ s: stage, at: now, by: who }]) : prev.history) : [{ s: stage, at: now, by: who }],
        createdAt: prev ? prev.createdAt : now, updatedAt: now, updatedBy: who
      });
      p.pending = true;
      return p;
    });
    state.purchases = state.purchases.filter(function (p) { return wasNew || p.req !== orig.req; }).concat(local);
    if (wasNew) { state.p.flashReq = req; revealP(v); }
    closePDialog();
    render();
    var payload = {
      req: wasNew ? 0 : orig.req, order: v.order, need: v.need, who: v.who, urgent: v.urgent, comment: v.comment,
      items: v.items.map(function (it) {
        return { id: it.id, title: it.title, qty: it.qty, unit: it.unit, stage: it.stage, supplier: it.supplier, price: it.price, invoice: it.invoice, eta: it.eta };
      })
    };
    write('psave', { request: payload }).then(function (res) {
      toast(wasNew ? 'Заявка № ' + ((res && res.savedReq) || req) + ' создана' : 'Заявка № ' + req + ' сохранена');
    }, function (err) {
      if (err && err.error === 'bad_code') return;
      state.purchases = state.purchases.filter(function (p) { return local.indexOf(p) === -1; });
      if (!wasNew && !state.purchases.some(function (p) { return p.req === orig.req; })) state.purchases = state.purchases.concat(orig.items);
      render();
      reopenPWithError(orig, v, err);
    });
  }

  function onPDeleteClick() {
    if (!pediting || state.mode !== 'live') return;
    if (!els.pbtnDelete.classList.contains('armed')) {
      els.pbtnDelete.classList.add('armed');

      if (err && err.error === 'bad_code') return;

    });
  }

  function supplierText(items) {
    var lines = items.filter(function (it) { return it.title && it.stage !== 'received' && it.stage !== 'cancelled'; })
      .map(function (it, i) {
        return (i + 1) + '. ' + it.title + (it.qty !== '' ? ' — ' + fmtNum(it.qty) + (it.unit ? ' ' + it.unit : '') : it.unit ? ' — ' + it.unit : '');
      });
    return lines.length ? 'Здравствуйте! Прошу сообщить цену и срок поставки:\n' + lines.join('\n') : '';
  }
  function legacyCopy(text) {
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
      (els.pdlg.open ? els.pdlg : document.body).appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      if (ok) resolve(); else reject(new Error('copy'));
    });
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
    }
    return legacyCopy(text);
  }

  /* ============ материалы в карточке заказа ============ */
  function renderMaterials(o) {
    if (!o || !o.num) { els.matWrap.hidden = true; els.matList.innerHTML = ''; return; }

      return;

    var got = 0, total = 0;
    list.forEach(function (p) {

      if (p.stage !== 'cancelled') total += pSum(p) || 0;
    });
    els.matSum.textContent = list.length + ' ' + plural(list.length, 'позиция', 'позиции', 'позиций') + ' · получено ' + got +

  /* ============ закупки: выгрузка в Excel ============ */
  function exportPXlsx() {
    if (exporting || !state.purchases.length) return;
    exporting = true;
    var label = els.btnExport.querySelector('span');
    els.btnExport.disabled = true;
    label.textContent = 'Готовлю…';
    loadXlsx().then(function (X) {
      var list = state.purchases.filter(function (p) { return !p.pending; })
        .map(function (p, i) { return [p, i]; })
        .sort(function (a, b) { return a[0].req - b[0].req || a[1] - b[1]; })
        .map(function (x) { return x[0]; });
      var head = ['№ заявки', 'Дата заявки', 'Кто заказал', 'Для заказа', 'Нужно к', 'Срочно', 'Материал', 'Кол-во', 'Ед.', 'Этап',
        'Поставщик', 'Цена за ед.', 'Сумма', '№ счёта', 'Поставка', 'Получено', 'Комментарий'];
      var aoa = [head].concat(list.map(function (p) {
        var sum = pSum(p);
        return [p.req, null, p.who, p.order ? orderLabel(p.order).replace(/\u00a0/g, ' ') : 'на склад', null, p.urgent ? 'да' : '',
          p.title, p.qty === '' ? null : p.qty, p.unit, PSTAGE[p.stage].label, p.supplier,
          p.price === '' ? null : p.price, sum === '' ? null : sum, p.invoice, null, null, p.comment];
      }));
      var ws = X.utils.aoa_to_sheet(aoa);
      var base = Date.UTC(1899, 11, 30);
      function putDate(r, c, ymd) {
        var t = ymdToUTC(ymd);
        if (!isNaN(t)) ws[X.utils.encode_cell({ r: r, c: c })] = { t: 'n', v: (t - base) / 864e5, z: 'dd.mm.yyyy' };
      }
      list.forEach(function (p, i) { putDate(i + 1, 1, p.date); putDate(i + 1, 4, p.need); putDate(i + 1, 14, p.eta); putDate(i + 1, 15, p.got); });
      ws['!cols'] = [9, 12, 18, 28, 12, 8, 40, 9, 7, 13, 26, 12, 14, 12, 12, 12, 30].map(function (w) { return { wch: w }; });
      ws['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: aoa.length - 1, c: head.length - 1 } }) };
      var wb = X.utils.book_new();
      X.utils.book_append_sheet(wb, ws, 'Заявки');
      var buf = X.write(wb, { bookType: 'xlsx', type: 'array' });
      var blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Заявки на закупку ' + fmtDate(todayYMD(), true) + '.xlsx';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    }).catch(function () {
      toast('Не удалось подготовить файл Excel. Проверьте интернет и попробуйте ещё раз.', 'error');
    }).then(function () {
      exporting = false;
      els.btnExport.disabled = false;
      label.textContent = 'Excel';
    });
  }

    else if (row.querySelector('[data-f="title"]').value.trim()) addPItem(true);
  });
  els.pbtnCopy.addEventListener('click', function () {
    var v = readPForm();
    var text = supplierText(v.items.map(function (it) { return { title: it.title, qty: it.qty, unit: it.unit, stage: it.stage }; }));
    if (!text) { showPFormMsg('В заявке нет позиций, которые нужно купить.', true); return; }
    copyText(text).then(function () {
      showPFormMsg('Список скопирован — вставьте его в сообщение поставщику.', false);
    }, function () {
      showPFormMsg('Не получилось скопировать автоматически. Попробуйте ещё раз.', true);
    });
  });
  els.btnMatReq.addEventListener('click', function () {
    if (!editing) return;
    if (isDirty()) { showFormMsg('Сначала сохраните изменения в заказе.', true); return; }
    var num = editing.num;
    closeDialog();
    setView('purchases');
    openPDialog(0, { order: num });
  });
  els.matList.addEventListener('click', function (e) {
    var li = e.target.closest('[data-req]');
    if (!li) return;
    if (isDirty()) { showFormMsg('Сначала сохраните изменения в заказе.', true); return; }
    var req = +li.getAttribute('data-req');
    closeDialog();
    setView('purchases');
    openPByReq(req);
  });

  /* ============ события ============ */
  var qTimer = null;
  els.btnNew.addEventListener('click', function () { if (state.view === 'purchases') openPDialog(0); else openDialog(null); });
  els.emptyAdd.addEventListener('click', function () { openDialog(null); });
  els.btnExport.addEventListener('click', function () { if (state.view === 'purchases') exportPXlsx(); else exportXlsx(); });
  els.noticeRetry.addEventListener('click', function () { load(); });
  els.btnRefresh.addEventListener('click', function () { if (state.mode === 'live') refresh(true); else if (state.mode === 'error') load(); });
  els.btnLogout.addEventListener('click', function () { logout(''); });
  els.route.addEventListener('click', function (e) {
    var b = e.target.closest('[data-stage]');
    if (!b) return;
    var k = b.getAttribute('data-stage');
    state.stage = state.stage === k ? '' : k;
    if (state.stage && state.tab !== 'active' && state.tab !== 'overdue' && state.tab !== 'all') { state.tab = 'active'; state.sort = null; }
    render();
  });
  els.tabs.addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]');
    if (!b) return;
    state.tab = b.getAttribute('data-tab');
    state.sort = null;
    if (state.tab === 'shipped' || state.tab === 'cancelled') state.stage = '';
    render();
  });
  els.q.addEventListener('input', function () {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { state.q = els.q.value.trim(); render(); }, 120);
  });
  els.kindFilter.addEventListener('change', function () { state.kind = els.kindFilter.value; render(); });
  els.stageChipClear.addEventListener('click', function () { state.stage = ''; render(); });
  els.emptyReset.addEventListener('click', function () {
    state.q = ''; els.q.value = ''; state.kind = ''; els.kindFilter.value = ''; state.stage = '';
    render();
  });
  els.thead.addEventListener('click', function (e) {
    var b = e.target.closest('[data-sort]');
    if (!b) return;
    var key = b.getAttribute('data-sort');
    var cur = state.sort || defaultSort();
    state.sort = cur.key === key ? { key: key, dir: cur.dir === 'asc' ? 'desc' : 'asc' } : { key: key, dir: key === 'num' ? 'desc' : 'asc' };
    render();
  });
  els.tbody.addEventListener('change', function (e) {
    var sel = e.target.closest('.stage-select');
    if (sel) changeStage(sel.getAttribute('data-id'), sel.value);
  });
  els.tbody.addEventListener('click', function (e) {
    if (e.target.closest('select, button, a, input')) return;
    var row = e.target.closest('.row');
    if (row) openById(row.getAttribute('data-id'));
  });
  els.tbody.addEventListener('keydown', function (e) {
    var t = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && t.classList && t.classList.contains('row')) {
      e.preventDefault();
      openById(t.getAttribute('data-id'));
    }
  });

  els.form.addEventListener('submit', saveForm);
  els.btnCancel.addEventListener('click', closeDialog);
  els.dlgClose.addEventListener('click', closeDialog);
  els.dlg.addEventListener('cancel', function (e) {
    if (isDirty()) {
      e.preventDefault();
      showFormMsg('Есть несохранённые изменения — нажмите «Сохранить» или «Отмена».', true);
    }
  });
  els.dlg.addEventListener('close', function () { editing = null; formSnapshot = ''; disarmDelete(); });
  els.btnDelete.addEventListener('click', onDeleteClick);
  f.stage.addEventListener('change', syncStageUI);
  f.customer.addEventListener('change', function () {
    if (f.contact.value.trim()) return;
    var name = f.customer.value.trim();
    for (var i = 0; i < state.orders.length; i++) {
      if (state.orders[i].customer === name && state.orders[i].contact) { f.contact.value = state.orders[i].contact; break; }
    }
  });
  els.form.addEventListener('input', function (e) {
    var fld = e.target.closest('.field');
    if (fld) fld.classList.remove('invalid');
  });

  /* автообновление: раз в минуту, пока вкладка открыта, и при возврате на вкладку */
  setInterval(function () {
    if (document.visibilityState === 'visible') refresh(false);
  }, 60000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && Date.now() - state.lastSync > 20000) refresh(false);
  });
  setInterval(function () { if (state.mode === 'live' && !els.dlg.open && !els.pdlg.open) render(); }, 10 * 60 * 1000);

  /* ============ запуск ============ */
  if (apiUrl() && creds.code) start();
  else showGate('');
})();
</script>
</body>
</html>
